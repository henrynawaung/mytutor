<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myTutor Review · Log in</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-page">
<form class="login" method="post" action="{{ url_for('login') }}" autocomplete="on">
  <h1>myTutor Review</h1>
  <p class="sub">Your second brain, on this laptop only.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Username<input name="username" autocomplete="username" required {% if disabled %}disabled{% endif %} autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required {% if disabled %}disabled{% endif %}></label>
  <button class="b ok wide" {% if disabled %}disabled{% endif %}>Log in</button>
</form></body></html>
